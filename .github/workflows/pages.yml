name: Deploy to GitHub Pages

# 每次推送到 main 就把整個專案部署到 GitHub Pages。
# 需要在 Settings → Pages 把 Source 設為「GitHub Actions」。
on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show game version
        run: grep -m1 "const VERSION" game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
