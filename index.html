<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大江湖</title>
<style>
  html,body{margin:0;height:100%;background:#1d2a22;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);
    color:#d8e0cf;font:14px/1.4 system-ui,sans-serif;text-shadow:0 1px 3px #000;
    pointer-events:none;white-space:nowrap;opacity:.9}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#d8e0cf;font:16px system-ui,sans-serif;background:#1d2a22}
  #loading[hidden],#hint[hidden]{display:none}
</style>
</head>
<body>
<div id="loading">載入中…</div>
<canvas id="c"></canvas>
<div id="hint">左半邊拖曳移動 · 電腦用 WASD 或方向鍵</div>
<script>
(() => {
'use strict';

const ASSET = 'assets/';
const SPEED = 120;          // 世界單位 / 秒
const HERO_H = 46;          // 主角在世界中的高度
const MAP_W = 820, MAP_H = 660;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, zoom = 2;

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  zoom = Math.max(1.0, Math.min(2.2, Math.min(innerWidth / 330, innerHeight / 480)));
}
addEventListener('resize', resize);
resize();

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('無法載入 ' + src));
    i.src = ASSET + src;
  });
}

// 去掉洋紅背景（#FF00FF），並裁切到圖案實際範圍
function keyAndTrim(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      if (p[i] > 180 && p[i + 1] < 110 && p[i + 2] > 180) {
        p[i + 3] = 0;
      } else {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  g.putImageData(d, 0, 0);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(c, minX, minY, w, h, 0, 0, w, h);
  return out;
}

// ---------- 載入素材 ----------
let assets = {};
async function loadAll() {
  const [fr, bk, sd, stone, house, tree] = await Promise.all([
    loadImg('characters/hero_front.png'),
    loadImg('characters/hero_back.png'),
    loadImg('characters/hero_side.png'),
    loadImg('tiles/stone_floor.png'),
    loadImg('buildings/house_01.png'),
    loadImg('props/tree_01.png'),
  ]);
  assets.hero = {
    down: keyAndTrim(fr), up: keyAndTrim(bk), side: keyAndTrim(sd)
  };
  assets.stone = stone;
  assets.house = keyAndTrim(house);
  assets.tree = keyAndTrim(tree);
}

// ---------- 世界 ----------
// 小鎮：中央一條十字石板路，房屋與大樹分散兩側
const props = [];   // {kind, img, x, y(底部中心), w, h}
function addProp(kind, img, x, y, w) {
  const h = w * img.height / img.width;
  props.push({ kind, img, x, y, w, h });
}
function buildWorld() {
  const H = assets.house, T = assets.tree;
  addProp('house', H, 300, 255, 110);
  addProp('house', H, 520, 255, 110);
  addProp('house', H, 300, 610, 110);
  addProp('house', H, 520, 610, 110);
  addProp('tree', T, 90, 130, 95);
  addProp('tree', T, 730, 120, 95);
  addProp('tree', T, 90, 520, 90);
  addProp('tree', T, 740, 540, 95);
  addProp('tree', T, 300, 70, 85);
  addProp('tree', T, 520, 80, 85);
  addProp('tree', T, 330, 650, 85);
  addProp('tree', T, 520, 690, 80);
}

// 碰撞框（世界座標）
const obstacles = [];
function buildObstacles() {
  for (const p of props) {
    if (p.kind === 'house') {
      obstacles.push({
        x0: p.x - p.w / 2 + p.w * 0.05, x1: p.x + p.w / 2 - p.w * 0.05,
        y0: p.y - p.h * 0.30, y1: p.y
      });
    } else {
      obstacles.push({
        x0: p.x - p.w * 0.07, x1: p.x + p.w * 0.07,
        y0: p.y - p.w * 0.10, y1: p.y
      });
    }
  }
}

// ---------- 主角 ----------
const P = { x: 410, y: 330, facing: 'down', walk: 0 };

function blocked(x, y) {
  // 腳底判定框
  const x0 = x - 7, x1 = x + 7, y0 = y - 4, y1 = y + 4;
  if (x0 < 0 || y0 < 0 || x1 > MAP_W || y1 > MAP_H) return true;
  for (const o of obstacles) {
    if (x1 > o.x0 && x0 < o.x1 && y1 > o.y0 && y0 < o.y1) return true;
  }
  return false;
}

// ---------- 輸入 ----------
const keys = new Set();
addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const joy = { active: false, x: 0, y: 0, dx: 0, dy: 0, ox: 0, oy: 0 };
let joyId = null;
const JOY_R = 60;
canvas.addEventListener('pointerdown', e => {
  if (e.clientX < innerWidth * 0.5 && joyId === null) {
    joyId = e.pointerId;
    joy.active = true; joy.ox = e.clientX; joy.oy = e.clientY;
    setJoy(e);
  }
});
addEventListener('pointermove', e => { if (e.pointerId === joyId) setJoy(e); });
function endJoy(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joy.active = false; joy.x = 0; joy.y = 0; joy.dx = 0; joy.dy = 0;
}
addEventListener('pointerup', endJoy);
addEventListener('pointercancel', endJoy);
function setJoy(e) {
  const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const m = Math.hypot(dx, dy), k = m > JOY_R ? JOY_R / m : 1;
  joy.dx = dx * k; joy.dy = dy * k;
  joy.x = joy.dx / JOY_R; joy.y = joy.dy / JOY_R;
}

function readInput() {
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) y -= 1;
  if (keys.has('s') || keys.has('arrowdown')) y += 1;
  if (joy.active) { x += joy.x; y += joy.y; }
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return { x, y };
}

// ---------- 更新 ----------
function update(dt) {
  const { x, y } = readInput();
  const moving = Math.hypot(x, y) > 0.05;
  if (moving) {
    if (Math.abs(x) > Math.abs(y)) P.facing = x > 0 ? 'right' : 'left';
    else P.facing = y > 0 ? 'down' : 'up';
    P.walk += dt * 10;

    // 分軸移動，碰到障礙就只停該軸，可以沿牆滑動
    const nx = P.x + x * SPEED * dt;
    if (!blocked(nx, P.y)) P.x = nx;
    const ny = P.y + y * SPEED * dt;
    if (!blocked(P.x, ny)) P.y = ny;
  } else {
    P.walk = 0;
  }
}

// ---------- 繪製 ----------
const grass = [];
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function buildGrass() {
  for (let i = 0; i < 420; i++) {
    grass.push({ x: rnd() * MAP_W, y: rnd() * MAP_H, r: 2 + rnd() * 4, s: rnd() });
  }
}

let stonePat = null;
let camX = 0, camY = 0;

function setWorldTransform() {
  const s = dpr * zoom;
  ctx.setTransform(s, 0, 0, s, -camX * s, -camY * s);
}

function clampCam() {
  const vw = innerWidth / zoom, vh = innerHeight / zoom;
  const tx = P.x - vw / 2, ty = P.y - vh / 2;
  camX = vw >= MAP_W ? (MAP_W - vw) / 2 : Math.max(0, Math.min(MAP_W - vw, tx));
  camY = vh >= MAP_H ? (MAP_H - vh) / 2 : Math.max(0, Math.min(MAP_H - vh, ty));
}

function drawGround() {
  // 地圖外的背景
  ctx.fillStyle = '#16201a';
  ctx.fillRect(camX - 200, camY - 200, innerWidth / zoom + 400, innerHeight / zoom + 400);
  // 草地
  ctx.fillStyle = '#33442f';
  ctx.fillRect(0, 0, MAP_W, MAP_H);
  // 草叢斑點
  ctx.fillStyle = '#2a3828';
  for (const g of grass) {
    ctx.globalAlpha = 0.5 + g.s * 0.4;
    ctx.fillRect(g.x, g.y, g.r, g.r * 0.6);
  }
  ctx.globalAlpha = 1;
  // 石板路（十字）
  if (!stonePat) {
    stonePat = ctx.createPattern(assets.stone, 'repeat');
    stonePat.setTransform(new DOMMatrix([0.16, 0, 0, 0.16, 0, 0]));
  }
  ctx.fillStyle = stonePat;
  ctx.fillRect(0, 280, MAP_W, 90);
  ctx.fillRect(360, 0, 100, MAP_H);
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, w * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawHero() {
  const f = P.facing;
  const img = f === 'up' ? assets.hero.up
            : (f === 'left' || f === 'right') ? assets.hero.side
            : assets.hero.down;
  const h = HERO_H, w = h * img.width / img.height;
  const bob = Math.abs(Math.sin(P.walk)) * 1.5 * (P.walk > 0 ? 1 : 0);
  drawShadow(P.x, P.y, w * 0.8);
  ctx.save();
  if (f === 'left') {
    ctx.translate(P.x, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, P.y - h - bob, w, h);
  } else {
    ctx.drawImage(img, P.x - w / 2, P.y - h - bob, w, h);
  }
  ctx.restore();
}

function drawProps() {
  // 依腳底 y 排序，後面的蓋住前面的
  const list = props.map(p => ({ y: p.y, draw: () => {
    drawShadow(p.x, p.y, p.w * 0.85);
    ctx.drawImage(p.img, p.x - p.w / 2, p.y - p.h, p.w, p.h);
  }}));
  list.push({ y: P.y, draw: drawHero });
  list.sort((a, b) => a.y - b.y);
  for (const item of list) item.draw();
}

function drawJoyUI() {
  // 畫在螢幕座標
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (joy.active) {
    ctx.strokeStyle = 'rgba(230,240,220,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(230,240,220,0.45)';
    ctx.beginPath(); ctx.arc(joy.ox + joy.dx, joy.oy + joy.dy, 22, 0, Math.PI * 2); ctx.fill();
  } else {
    // 靜態提示圈
    const cx = 90, cy = innerHeight - 110;
    ctx.strokeStyle = 'rgba(230,240,220,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, JOY_R, 0, Math.PI * 2); ctx.stroke();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#16201a';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  setWorldTransform();
  drawGround();
  drawProps();
  drawJoyUI();
}

// ---------- 主迴圈 ----------
let last = performance.now();
const hint = document.getElementById('hint');
let elapsed = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  elapsed += dt;
  if (elapsed > 6) hint.hidden = true;
  update(dt);
  clampCam();
  render();
  requestAnimationFrame(frame);
}

// ---------- 啟動 ----------
loadAll().then(() => {
  buildWorld();
  buildObstacles();
  buildGrass();
  document.getElementById('loading').hidden = true;
  requestAnimationFrame(t => { last = t; frame(t); });
}).catch(err => {
  document.getElementById('loading').textContent = '素材載入失敗：' + err.message;
});
})();
</script>
</body>
</html>
